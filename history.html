
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排便紀錄｜PooLog</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .history-container {
            max-width: 1100px;
            min-height: 65vh;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .history-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .history-heading h1 {
            color: #344f3e;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .history-heading p {
            color: #777;
            font-size: 15px;
        }

        .record-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .record-count {
            color: #456b57;
            font-weight: 600;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .record-table th {
            background: #edf4ed;
            color: #456b57;
            padding: 16px 12px;
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
        }

        .record-table td {
            padding: 15px 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            color: #555;
        }

        .record-table tr:last-child td {
            border-bottom: none;
        }

        .record-table tbody tr:hover {
            background: #f8faf7;
        }

        .status-label {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            background: #edf4ed;
            color: #456b57;
            font-size: 13px;
            white-space: nowrap;
        }

        .message {
            text-align: center;
            padding: 45px 15px;
            color: #888;
            background: #fff;
            border-radius: 12px;
        }

        .error-message {
            color: #b94a48;
        }

        @media (max-width: 600px) {
            .history-container {
                padding: 45px 16px;
            }

            .history-heading h1 {
                font-size: 26px;
            }

            .record-summary {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- 導覽列 -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">PooLog</a>

            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="history.html" class="active">排便紀錄</a>
                <a href="statistics.html">排便統計</a>
                <a href="settings.html">個人設定</a>
                <a href="login.html" id="authLink">登入</a>
            </nav>
        </div>
    </header>


    <!-- 排便紀錄總覽 -->
    <main class="history-container">

        <section class="history-heading">
            <h1>排便紀錄總覽</h1>
            <p>查看系統中所有已儲存的排便紀錄，掌握每日排便情形。</p>
        </section>

        <div class="record-summary">
            <div class="record-count" id="recordCount">
                目前共有 0 筆紀錄
            </div>
        </div>

        <div id="recordMessage" class="message">
            正在載入排便紀錄...
        </div>

        <div class="table-wrapper" id="tableWrapper" hidden>
            <table class="record-table">
                <thead>
                    <tr>
                        <th>排便日期</th>
                        <th>排便時間</th>
                        <th>糞便形狀</th>
                        <th>糞便顏色</th>
                        <th>紀錄狀態</th>
                    </tr>
                </thead>

                <tbody id="recordList">
                </tbody>
            </table>
        </div>

    </main>


    <!-- 頁尾 -->
    <footer class="footer">
        <p>記錄日常，關心健康。</p>
        <p>© 2026 PooLog 排便紀錄系統</p>
    </footer>


    <!-- Supabase 設定 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-nav.js" defer></script>

    <!-- 排便紀錄查詢 -->
    <script>
        const supabase = window.supabaseClient;

        const recordList = document.getElementById("recordList");
        const recordMessage = document.getElementById("recordMessage");
        const tableWrapper = document.getElementById("tableWrapper");
        const recordCount = document.getElementById("recordCount");


        // 建立表格欄位
        function createCell(text) {
            const td = document.createElement("td");
            td.textContent = text;
            return td;
        }


        // 顯示排便紀錄
        function displayRecords(records) {
            recordList.innerHTML = "";

            recordCount.textContent = `目前共有 ${records.length} 筆紀錄`;

            if (records.length === 0) {
                tableWrapper.hidden = true;
                recordMessage.hidden = false;
                recordMessage.className = "message";
                recordMessage.textContent = "目前尚無排便紀錄。";
                return;
            }

            records.forEach(record => {
                const tr = document.createElement("tr");

                tr.appendChild(createCell(record.record_date || "未提供"));
                tr.appendChild(createCell(record.record_time || "未提供"));
                tr.appendChild(createCell(record.stool_shape || "未提供"));
                tr.appendChild(createCell(record.stool_color || "未提供"));

                const statusCell = document.createElement("td");
                const statusLabel = document.createElement("span");

                statusLabel.className = "status-label";
                statusLabel.textContent = "已儲存";

                statusCell.appendChild(statusLabel);
                tr.appendChild(statusCell);

                recordList.appendChild(tr);
            });

            recordMessage.hidden = true;
            tableWrapper.hidden = false;
        }


        // 從 Supabase 取得所有排便紀錄
        async function loadRecords() {
            if (!supabase) {
                recordMessage.hidden = false;
                recordMessage.className = "message error-message";
                recordMessage.textContent =
                    "Supabase 尚未成功連線，請檢查 supabase-config.js 設定。";
                return;
            }

            const { data, error } = await supabase
                .from("bowel_records")
                .select("id, record_date, record_time, stool_shape, stool_color")
                .order("record_date", { ascending: false })
                .order("record_time", { ascending: false });

            if (error) {
                console.error("讀取排便紀錄失敗：", error);

                recordMessage.hidden = false;
                recordMessage.className = "message error-message";
                recordMessage.textContent =
                    "讀取資料失敗：" + error.message;

                tableWrapper.hidden = true;
                return;
            }

            displayRecords(data || []);
        }


        // 頁面載入後執行查詢
        loadRecords();
    </script>

</body>
</html>
