
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PooLog｜排便紀錄</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* 排便紀錄頁面 */
        .history-container {
            max-width: 760px;
            margin: 30px auto;
        }

        .history-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #edf1ec;
            margin-bottom: 30px;
        }

        .history-card h2 {
            font-size: 20px;
            color: #456b57;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #53665a;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce5dc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: #34463b;
            background: #ffffff;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #648b76;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            background: #648b76;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .submit-button:hover {
            background: #456b57;
        }

        /* 紀錄列表 */
        .record-item {
            padding: 18px;
            border: 1px solid #edf1ec;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #ffffff;
        }

        .record-date {
            color: #456b57;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .record-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            color: #718076;
            font-size: 14px;
        }

        .empty-message {
            text-align: center;
            color: #a0aaa2;
            padding: 30px 10px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .history-card {
                padding: 22px 18px;
            }

            .record-detail {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- 導覽列 -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">PooLog</a>

            <nav class="nav-menu">
                <a href="index.html">首頁</a>
                <a href="history.html" class="active">排便紀錄</a>
                <a href="statistics.html">排便統計</a>
                <a href="settings.html">個人設定</a>
            </nav>
        </div>
    </header>

    <!-- 頁面內容 -->
    <main class="page-content">

        <div class="page-heading">
            <p class="section-label">BOWEL MOVEMENT HISTORY</p>
            <h1>排便紀錄</h1>
        </div>

        <div class="history-container">

            <!-- 新增排便紀錄 -->
            <section class="history-card">

                <h2>新增排便紀錄</h2>

                <form id="historyForm">

                    <!-- 日期 -->
                    <div class="form-group">
                        <label for="recordDate">排便日期</label>
                        <input
                            type="date"
                            id="recordDate"
                            required
                        >
                    </div>

                    <!-- 糞便形狀 -->
                    <div class="form-group">
                        <label for="stoolShape">糞便形狀</label>

                        <select id="stoolShape" required>
                            <option value="">請選擇糞便形狀</option>
                            <option value="第一型｜一顆顆硬球狀">第一型｜一顆顆硬球狀</option>
                            <option value="第二型｜香腸狀但表面凹凸">第二型｜香腸狀但表面凹凸</option>
                            <option value="第三型｜香腸狀且表面有裂痕">第三型｜香腸狀且表面有裂痕</option>
                            <option value="第四型｜表面光滑的香腸狀">第四型｜表面光滑的香腸狀</option>
                            <option value="第五型｜柔軟的塊狀">第五型｜柔軟的塊狀</option>
                            <option value="第六型｜糊狀且邊緣不規則">第六型｜糊狀且邊緣不規則</option>
                            <option value="第七型｜水狀無固體">第七型｜水狀無固體</option>
                        </select>
                    </div>

                    <!-- 糞便顏色 -->
                    <div class="form-group">
                        <label for="stoolColor">糞便顏色</label>

                        <select id="stoolColor" required>
                            <option value="">請選擇糞便顏色</option>
                            <option value="棕色">棕色</option>
                            <option value="深棕色">深棕色</option>
                            <option value="淺棕色">淺棕色</option>
                            <option value="黃色">黃色</option>
                            <option value="綠色">綠色</option>
                            <option value="黑色">黑色</option>
                            <option value="紅色">紅色</option>
                            <option value="灰白色">灰白色</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-button">
                        新增紀錄
                    </button>

                </form>
            </section>

            <!-- 排便紀錄列表 -->
            <section class="history-card">

                <h2>我的排便紀錄</h2>

                <div id="recordList">
                    <p class="empty-message">
                        目前尚無排便紀錄
                    </p>
                </div>

            </section>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="footer-logo">PooLog</div>
        <p>記錄日常，關心健康。</p>
        <p class="copyright">
            © 2026 PooLog. All Rights Reserved.
        </p>
    </footer>


    <!-- JavaScript -->
    <script>

        // localStorage 儲存名稱
        const STORAGE_KEY = "pooLogRecords";

        // 取得 HTML 元素
        const historyForm = document.getElementById("historyForm");
        const recordDate = document.getElementById("recordDate");
        const stoolShape = document.getElementById("stoolShape");
        const stoolColor = document.getElementById("stoolColor");
        const recordList = document.getElementById("recordList");

        // 取得目前日期
        const today = new Date();
        const localDate = new Date(
            today.getTime() - today.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        // 預設日期為今天
        recordDate.value = localDate;

        // 讀取 localStorage
        function getRecords() {
            try {
                const records = JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

                return Array.isArray(records) ? records : [];
            } catch (error) {
                return [];
            }
        }

        // 顯示排便紀錄
        function displayRecords() {

            const records = getRecords();

            // 清空原本內容
            recordList.innerHTML = "";

            // 沒有紀錄時顯示提示
            if (records.length === 0) {
                recordList.innerHTML = `
                    <p class="empty-message">
                        目前尚無排便紀錄
                    </p>
                `;
                return;
            }

            // 依日期由新到舊排序
            records.sort((a, b) => {
                return b.date.localeCompare(a.date) ||
                    b.id - a.id;
            });

            // 顯示每筆紀錄
            records.forEach(record => {

                const item = document.createElement("div");
                item.className = "record-item";

                const date = document.createElement("div");
                date.className = "record-date";
                date.textContent = record.date;

                const detail = document.createElement("div");
                detail.className = "record-detail";

                const shape = document.createElement("span");
                shape.textContent = "糞便形狀：" + record.shape;

                const color = document.createElement("span");
                color.textContent = "糞便顏色：" + record.color;

                detail.appendChild(shape);
                detail.appendChild(color);

                item.appendChild(date);
                item.appendChild(detail);

                recordList.appendChild(item);
            });
        }

        // 新增排便紀錄
        historyForm.addEventListener("submit", function(event) {

            event.preventDefault();

            // 取得表單資料
            const newRecord = {
                id: Date.now(),
                date: recordDate.value,
                shape: stoolShape.value,
                color: stoolColor.value
            };

            // 讀取原有紀錄
            const records = getRecords();

            // 新增紀錄
            records.push(newRecord);

            // 儲存至 localStorage
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(records)
                );
            } catch (error) {
                alert("儲存失敗，請檢查瀏覽器儲存空間。");
                return;
            }

            // 更新紀錄列表
            displayRecords();

            // 重設表單
            historyForm.reset();

            // 日期恢復為今天
            recordDate.value = localDate;

            // 提示新增成功
            alert("排便紀錄新增成功！");

        });

        // 頁面載入時顯示紀錄
        displayRecords();

    </script>

</body>
</html>
